[agent]
  interval            = "2s"
  round_interval      = true
  metric_batch_size   = 1000
  metric_buffer_limit = 10000
  flush_interval      = "5s"

[[inputs.mqtt_consumer]]
  servers   = ["tcp://mosquitto:1883"]
  topics    = ["curry/bench/events"]
  client_id = "telegraf-curry-bench"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "iterations"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "timestamp_ms"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mean"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stddev"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "p50"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "p95"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "p99"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "min"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "max"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gc_minor_count"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gc_major_count"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gc_minor_total_us"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gc_minor_max_us"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gc_heap_bytes"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gc_nursery_used"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gc_p99_us"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "event"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "benchmark"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "gc"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "mode"

[[outputs.influxdb_v2]]
  urls   = ["http://influxdb:8086"]
  token        = "curry-bench-token"
  organization = "curry"
  bucket       = "benchmarks"
