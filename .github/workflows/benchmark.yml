name: Benchmark

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `permissions:` values must be static literals — GitHub's own context-
    # availability table doesn't list `permissions` among the keys that
    # accept `${{ }}` expressions, and a workflow that uses one there is
    # silently rejected wholesale (every run shows "This run likely failed
    # because of a workflow file issue" / "No jobs were run", with zero
    # diagnostic pointing at this line — confirmed via `gh api .../jobs`
    # returning zero jobs on every push since this workflow was added).
    # `contents: write` is granted unconditionally; the actual write only
    # happens on a push-to-main run, gated below via `auto-push:` (an
    # ordinary `with:` input, which — unlike `permissions:` — does support
    # expressions). For a pull_request run from a fork, GitHub restricts
    # GITHUB_TOKEN to read-only regardless of what's granted here; the
    # residual exposure is limited to a same-repo (non-fork) PR run, which
    # still never exercises the write path.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libgmp-dev cmake build-essential pkg-config

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Run benchmark suite
        run: ./build/curry tests/bench_ci.scm --out bench-results.json

      - name: Store benchmark result, compare, and gate on regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Only push a new baseline point when we're actually on main —
          # PR runs compare against the existing baseline without mutating it.
          auto-push: ${{ github.event_name == 'push' }}
          comment-on-alert: true
          alert-comment-cc-users: ''
          # >130% of the stored baseline (i.e. >30% slower) fails the run.
          alert-threshold: '130%'
          fail-on-alert: true
          summary-always: true
