name: Benchmark

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `permissions:` values must be static literals — GitHub's own context-
    # availability table doesn't list `permissions` among the keys that
    # accept `${{ }}` expressions, and a workflow that uses one there is
    # silently rejected wholesale (every run shows "This run likely failed
    # because of a workflow file issue" / "No jobs were run", with zero
    # diagnostic pointing at this line — confirmed via `gh api .../jobs`
    # returning zero jobs on every push since this workflow was added).
    # `contents: write` is granted unconditionally; the actual write only
    # happens on a push-to-main run, gated below via `auto-push:` (an
    # ordinary `with:` input, which — unlike `permissions:` — does support
    # expressions). For a pull_request run from a fork, GitHub restricts
    # GITHUB_TOKEN to read-only regardless of what's granted here; the
    # residual exposure is limited to a same-repo (non-fork) PR run, which
    # still never exercises the write path.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libgmp-dev cmake build-essential pkg-config

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Run benchmark suite
        run: ./build/curry tests/bench_ci.scm --out bench-results.json

      - name: Store benchmark result, compare, and gate on regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Only push a new baseline point when we're actually on main —
          # PR runs compare against the existing baseline without mutating it.
          auto-push: ${{ github.event_name == 'push' }}
          comment-on-alert: true
          alert-comment-cc-users: ''
          # See issue #251: on this workflow's shared ubuntu-latest runner,
          # fib(25)/vm alone swung between 11.67ms and 22.47ms across 10
          # consecutive commits immediately preceding that issue, several of
          # which touched zero VM code (docs/Homebrew-formula-only changes)
          # -- a ~2x natural cross-run variance from which host the runner
          # lands on, not scheduling jitter (bench_ci.scm already takes the
          # median of 7 timed runs per benchmark internally, which is the
          # tool for jitter within a single run; it cannot smooth out which
          # physical host a whole job gets scheduled onto). A 130% gate
          # inside that band produced two different false-positive failures
          # -- flagging a different subset of benchmarks each time -- on the
          # exact same commit of a change that didn't even compile the code
          # path it was blamed on (PR #250 touched only (curry ffi), built
          # here with no -DBUILD_FFI=ON at all). alert-threshold stays at
          # 130% (still useful signal — the PR comment below is informative
          # regardless of outcome) but fail-on-alert is now false so a
          # noise-driven alert can no longer block a merge; a maintainer
          # reading the comment decides whether a flagged delta is real.
          alert-threshold: '130%'
          fail-on-alert: false
          summary-always: true
